# Bardwave settings. Keep this file next to the program (Bardwave.exe).
# Every key is optional; the app writes the rest (library, access key) itself.

[server]
host = "0.0.0.0"   # bind address; "0.0.0.0" = every IPv4 network of this PC
port = 8080
upnp = true        # ask the router to open the port for players outside the LAN
# access_token is generated on the first start: players need it in the link
# (http://<address>:8080/?k=<key>). Set it to "" to let anyone listen.
# gm_token is generated on the first start too: it opens the control page
# (--server-only) from another device (http://<address>:8080/control?g=<key>),
# so remote control is on by default. Set it to "" to keep the page on this PC.

# HTTPS: off by default, fine on a home network. Turn it on for players across
# the internet (the keys in the links are then encrypted). Same port, links and
# QR start with https://. Applies on the next Start; see docs/en/https.md.
# Console: SERVER panel > SECURE CONNECTION (HTTPS).
tls = false
# Your own PEM certificate chain and its private key (for example from Let's
# Encrypt or Caddy). Set both or neither. Neither = a self-signed certificate
# made by Bardwave and kept in the "tls" folder of the data directory.
# tls_cert = "/etc/ssl/bardwave/fullchain.pem"
# tls_key = "/etc/ssl/bardwave/privkey.pem"

[audio]
buffer_size = 960  # sound-card buffer in frames (960 = 20 ms); 0 = driver default
sample_rate = 48000 # sound-card rate to ask for; the stream itself is always 48 kHz
channels = 2       # sound-card channels: 1 = mono, 2 = stereo
master_volume = 0.8

[logging]
level = "info"      # trace | debug | info | warn | error
file_logging = false # true: also write bardwave.log next to the program

[gui]
reduce_motion = false # stop the pulsing dot and backdrop animation
