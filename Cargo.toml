[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
# GUI
egui = "0.30"
eframe = { version = "0.30", features = ["accesskit", "persistence"] }
rfd = "0.13"

# Audio
cpal = { version = "0.15", features = [] }
symphonia = { version = "0.5", features = ["vorbis", "mp3", "flac", "wav", "aac"] }

# Async & Network
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# UPnP port forwarding (open router port for global-IP access): SSDP needs
# the multicast interface pinned (socket2), descriptions/SOAP are XML (roxmltree)
socket2 = "0.6"
roxmltree = "0.21"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
parking_lot = "0.12"
crossbeam-channel = "0.5"
bytemuck = "1"
uuid = { version = "1", features = ["v4", "serde"] }
backtrace = "0.3"
tower-http = { version = "0.5", features = ["trace"] }
ctrlc = "3.4"

[package]
name = "soundshared"
version = "1.2.0"
edition = "2021"
description = "Open-source TTRPG soundboard: desktop ambience console streamed to players' browsers over LAN."
license = "MIT"
repository = "https://github.com/adamantida/Bardwave"
homepage = "https://github.com/adamantida/Bardwave"
readme = "README.md"
keywords = ["ttrpg", "soundboard", "audio", "streaming", "egui"]
categories = ["multimedia::audio", "games"]

[dependencies]
# Workspace deps
egui = { workspace = true }
eframe = { workspace = true }
cpal = { workspace = true }
symphonia = { workspace = true }
rusty-opus = { version = "1.0" }
tokio = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
uuid = { workspace = true }
rfd = { workspace = true }
tower-http = { workspace = true }
backtrace = { workspace = true }
ctrlc = { workspace = true }
socket2 = { workspace = true }
roxmltree = { workspace = true }
