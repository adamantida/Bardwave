[workspace]
resolver = "2"
members = ["."]

[workspace.dependencies]
# GUI
egui = "0.30"
eframe = { version = "0.30", features = ["accesskit", "persistence"] }
rfd = "0.13"

# Audio
cpal = { version = "0.15", features = [] }
symphonia = { version = "0.5", features = ["vorbis", "mp3", "flac", "wav", "aac"] }

# Async & Network
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }

# UPnP port forwarding (open router port for global-IP access): SSDP needs
# the multicast interface pinned (socket2), descriptions/SOAP are XML (roxmltree)
socket2 = "0.6"
roxmltree = "0.21"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
# Self-downloading yt-dlp (one-time, from its GitHub releases) so the
# YouTube feature works without any manual installation.
ureq = { version = "2.10", default-features = false, features = ["tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
parking_lot = "0.12"
crossbeam-channel = "0.5"
bytemuck = "1"
uuid = { version = "1", features = ["v4", "serde"] }
backtrace = "0.3"
tower-http = { version = "0.5", features = ["trace"] }
ctrlc = "3.4"

[package]
name = "soundshared"
version = "1.4.0"
edition = "2021"
description = "Open-source TTRPG soundboard: desktop ambience console streamed to players' browsers over LAN."
license = "MIT"
repository = "https://github.com/adamantida/Bardwave"
homepage = "https://github.com/adamantida/Bardwave"
readme = "README.md"
keywords = ["ttrpg", "soundboard", "audio", "streaming", "egui"]
categories = ["multimedia::audio", "games"]

[dependencies]
# Workspace deps
egui = { workspace = true }
eframe = { workspace = true }
cpal = { workspace = true }
symphonia = { workspace = true }
rusty-opus = { version = "1.0" }
tokio = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
ureq = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = { workspace = true }
bytemuck = { workspace = true }
uuid = { workspace = true }
rfd = { workspace = true }
tower-http = { workspace = true }
backtrace = { workspace = true }
ctrlc = { workspace = true }
socket2 = { workspace = true }
roxmltree = { workspace = true }
# EBU R128 loudness measurement (pure Rust) for track normalization
ebur128 = "0.1.11"
# Library bundles (.zip export/import); deflate only, via flate2 (pure Rust)
zip = { version = "=2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] }

# getifaddrs for LAN address detection on Linux / macOS
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Debian/Ubuntu package: `cargo deb` (cargo-deb), see packaging/linux and
# .github/workflows/release-extras.yml. The crate is called `soundshared`; the
# package, the installed binary and the menu entry are called Bardwave.
[package.metadata.deb]
name = "bardwave"
maintainer = "Bardwave contributors <noreply@github.com>"
section = "sound"
priority = "optional"
license-file = ["LICENSE", "0"]
extended-description = """\
Bardwave is a desktop ambience console for tabletop role-playing games. \
It mixes music, ambience and sound effects on the game master's computer \
and streams the result to the players' browsers over the local network \
(or the internet). Players only open a link; nothing is installed on their side."""
# $auto adds the exact shared libraries the binary links against; the rest are
# libraries loaded at run time (winit/egui dlopen X11/Wayland/xkbcommon, rfd
# loads GTK 3) plus the CI build list (libasound2 for cpal, libssl for TLS).
# The "t64" names are the Ubuntu 24.04 / Debian 13 renames of the same packages.
depends = "$auto, libasound2 | libasound2t64, libgtk-3-0 | libgtk-3-0t64, libxkbcommon0, libssl3 | libssl3t64"
assets = [
    ["target/release/soundshared", "usr/bin/bardwave", "755"],
    ["packaging/linux/bardwave.desktop", "usr/share/applications/bardwave.desktop", "644"],
    ["assets/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/bardwave.png", "644"],
    ["assets/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/bardwave.png", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/bardwave.png", "644"],
    ["assets/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/bardwave.png", "644"],
    ["README.md", "usr/share/doc/bardwave/README.md", "644"],
    ["packaging/README.txt", "usr/share/doc/bardwave/QUICKSTART.txt", "644"],
    ["packaging/config.toml", "usr/share/doc/bardwave/examples/config.toml", "644"],
]
